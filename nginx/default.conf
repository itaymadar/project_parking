server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /images/ {
        return 302 /;
    }

    location /images-list/ {
        proxy_pass http://storage:80/images/;
    }

    location /images/ {
        proxy_pass http://storage:80/images/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
