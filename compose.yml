services:
  web:
    build: ./nginx
    container_name: smart-parking-web
    ports:
      - "8080:80"
    networks:
      - parking-network

  storage:
    build: ./storage
    container_name: smart-parking-storage
    volumes:
      - parking-images:/usr/local/apache2/htdocs/images/
    networks:
      - parking-network

networks:
  parking-network:
    driver: bridge

volumes:
  parking-images:
